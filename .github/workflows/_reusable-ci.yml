name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            constraints.txt
            backend/constraints.txt
            backend/requirements.txt
            backend/requirements-dev.txt
            ml/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend and ML tests with coverage
        run: PYTHONPATH=backend pytest -q
      - name: Upload Python coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage/python
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Build frontend
        run: npm run build
