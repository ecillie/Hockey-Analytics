name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ml-gate:
    name: ML correctness and evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run ML correctness tests
        run: PYTHONPATH=. pytest --no-cov -q ml/tests
      - name: Enforce metric regression thresholds
        run: PYTHONPATH=. python -m ml.evaluation.gate

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradevalue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradevalue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            constraints.txt
            backend/constraints.txt
            backend/requirements.txt
            backend/requirements-dev.txt
            ml/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply test database schema
        run: psql -h localhost -U postgres -d tradevalue_test -v ON_ERROR_STOP=1 -f backend/database/schema.sql
      - name: Run backend and ML tests with coverage
        run: PYTHONPATH=backend pytest -q
      - name: Enforce complete service-layer coverage
        run: python -m coverage report --include=backend/app/api/service.py --fail-under=100
      - name: Upload Python coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage/python
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Build frontend
        run: npm run build
