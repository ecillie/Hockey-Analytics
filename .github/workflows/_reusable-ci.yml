name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradevalue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradevalue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tradevalue_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            constraints.txt
            backend/constraints.txt
            backend/requirements.txt
            backend/requirements-dev.txt
            ml/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate linear migration history
        run: python backend/database/verify_migrations.py
      - name: Generate reviewable migration SQL
        run: |
          mkdir -p coverage/migrations
          python -m alembic -c backend/alembic.ini upgrade head --sql > coverage/migrations/upgrade.sql
      - name: Check database migration preconditions
        run: python backend/database/migration_preflight.py
      - name: Upgrade empty database to head
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Verify migrated schema snapshot
        run: python backend/database/schema_snapshot.py --actual coverage/migrations/schema.actual.json
      - name: Verify repeated upgrade is a no-op
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini current --check-heads
      - name: Verify downgrade and re-upgrade round trip
        run: |
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
          python backend/database/schema_snapshot.py --actual coverage/migrations/schema.round-trip.json
      - name: Smoke-test migrated API
        run: PYTHONPATH=backend python backend/database/migration_smoke.py
      - name: Run backend and ML tests with coverage
        run: PYTHONPATH=backend pytest -q
      - name: Enforce complete service-layer coverage
        run: python -m coverage report --include=backend/app/api/service.py --fail-under=100
      - name: Upload Python coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage/python
          if-no-files-found: warn
          retention-days: 14
      - name: Upload migration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics
          path: coverage/migrations
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Build frontend
        run: npm run build
