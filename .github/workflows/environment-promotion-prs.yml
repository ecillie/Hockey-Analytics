name: Environment Promotion

on:
  push:
    branches:
      - Dev
      - NonProd

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dev-to-nonprod:
    if: github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest

    steps:
      - name: Create and merge Dev → NonProd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "NonProd" \
            --head "Dev" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base "NonProd" \
              --head "Dev" \
              --title "Promote Dev to NonProd" \
              --body "Automated promotion from \`Dev\` to \`NonProd\`.")

            PR_NUMBER=$(echo "$PR_URL" | awk -F/ '{print $NF}')
          fi

          echo "Squash merging PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --admin

  nonprod-to-prod:
    if: github.ref == 'refs/heads/NonProd'
    runs-on: ubuntu-latest

    steps:
      - name: Create and merge NonProd → Prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "Prod" \
            --head "NonProd" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base "Prod" \
              --head "NonProd" \
              --title "Promote NonProd to Prod" \
              --body "Automated promotion from \`NonProd\` to \`Prod\`.")

            PR_NUMBER=$(echo "$PR_URL" | awk -F/ '{print $NF}')
          fi

          echo "Squash merging PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --admin