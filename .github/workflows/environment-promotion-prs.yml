name: Environment Promotion PRs

on:
  push:
    branches:
      - Dev
      - NonProd

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dev-to-nonprod:
    if: github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest

    steps:
      - name: Open Dev → NonProd PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "NonProd" \
            --head "Dev" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Dev → NonProd PR already exists: #$EXISTING_PR"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base "NonProd" \
              --head "Dev" \
              --title "Promote Dev to NonProd" \
              --body "Automated promotion PR from \`Dev\` to \`NonProd\`."
          fi

  nonprod-to-prod:
    if: github.ref == 'refs/heads/NonProd'
    runs-on: ubuntu-latest

    steps:
      - name: Open NonProd → Prod PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "Prod" \
            --head "NonProd" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "NonProd → Prod PR already exists: #$EXISTING_PR"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base "Prod" \
              --head "NonProd" \
              --title "Promote NonProd to Prod" \
              --body "Automated promotion PR from \`NonProd\` to \`Prod\`."
          fi