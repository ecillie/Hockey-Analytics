name: Prod

on:
  pull_request:
    branches: [Prod]
  push:
    branches: [Prod]
  workflow_dispatch:

concurrency:
  group: prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_reusable-ci.yml

  required:
    name: Prod required
    if: ${{ always() }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = "success"

  merge-to-prod:
    name: Enable automatic merge to Prod
    if: ${{ github.event_name == 'pull_request' && needs.required.result == 'success' }}
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge for the validated pull request
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --merge
