[tool.pytest.ini_options]
addopts = "--cov=app --cov=ml --cov-branch --cov-report=term-missing --cov-report=html:coverage/python/html --cov-report=xml:coverage/python/coverage.xml --cov-report=lcov:coverage/python/lcov.info --cov-fail-under=46.94"
testpaths = ["backend/tests", "ml/tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app", "ml"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
